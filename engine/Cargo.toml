[package]
name = "craft-bridge"
version = "0.2.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "A narrow WebAssembly bridge to the ArtCraft format crates, used by DesignLab for PPTX import and export."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"

# Pinned to a commit rather than a branch: the bridge is built in CI, and a
# moving dependency would make a green build say nothing about the next one.
#
# Only the PPTX path is pulled in. Its dependency graph is quick-xml, zip
# (pure-Rust deflate), thiserror and the model/geom/colour crates — no native
# code, so it builds for wasm32 unchanged. Deliberately absent: deckcraft-pdf,
# which needs the upstream `[patch.crates-io]` entry for krilla, and
# deckcraft-fonts, whose build script wants a CRAFT_FONTS_DIR checkout.
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "38d2ade2b77de39c0e06278ddfd44d1082ff80a8" }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "38d2ade2b77de39c0e06278ddfd44d1082ff80a8" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack ships its own binaryen, which validates against a feature set older
# than what current rustc emits: without these the build fails on `memory.copy`
# with "Bulk memory operations require bulk memory". Naming the features keeps
# the optimiser rather than turning it off.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-multivalue",
]
