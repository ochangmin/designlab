name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs `pages` and `id-token`; nothing here writes to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer commit supersedes an in-flight deploy, but never cancels one that is
# already publishing — that would leave the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The WebAssembly bridge to the ArtCraft format crates. It is additive: if
  # this job fails the site still deploys, just without PPTX import, which the
  # app reports rather than breaking on.
  engine:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # getrandom 0.3+ needs its web backend named explicitly for
      # wasm32-unknown-unknown; PdfCraft's renderer depends on it.
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # A pinned official release rather than `cargo install`, which would
      # rebuild the tool on every cold cache.
      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version

      - name: Build the bridge
        run: wasm-pack build engine --target web --release --out-dir pkg --no-typescript

      - name: Report the artifact size
        run: ls -la engine/pkg

      - uses: actions/upload-artifact@v4
        with:
          name: craft-engine
          path: engine/pkg
          if-no-files-found: error

  build:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Absent when the engine job failed; the site is built without it.
      - name: Fetch the format engine
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: craft-engine
          path: public/engine

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
